spring:
  datasource:
    url: jdbc:h2:mem:polazu_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

polazu:
  auth:
    secure-cookie: false
  cors:
    allowed-origins: http://127.0.0.1:3000,http://localhost:3000
