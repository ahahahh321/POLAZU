spring:
  application:
    name: interface-lab-backend
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:interface_lab}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  # 현재 단계에서는 같은 PC에서만 접근할 수 있게 서버를 loopback 주소에 묶습니다.
  address: 127.0.0.1
  port: 8080
  max-http-request-header-size: 16KB
